name: facevault_mobile
description: Employee mobile application for FaceVault offline attendance.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  connectivity_plus: ^6.0.5
  crypto: ^3.0.5
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.1
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  google_mlkit_face_detection: ^0.11.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  shimmer: ^3.0.0
  sqflite: ^2.3.3
  tflite_flutter: ^0.11.0
  uuid: ^4.5.1
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  test: ^1.31.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/lottie/
    - assets/models/
