<body class="h-full bg-background flex flex-col items-center justify-center p-container-padding-mobile md:p-container-padding-desktop font-body-md text-on-surface">
<main class="w-full max-w-[440px] flex flex-col gap-stack-lg">
<!-- Logo Header -->
<div class="flex flex-col items-center gap-stack-sm text-center">
<div class="w-16 h-16 rounded-xl overflow-hidden shadow-elevation-1 bg-surface border border-border-subtle flex items-center justify-center p-2 mb-2">
<img alt="SecureAI Attendance Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLu3qfLOLZoD31IRTOrTWSzPGJux_05Qb08M82YkT2vcRJju-kkdKIJZR2-2cMDcTxzLd-aPuq2AA1Hw7P3aZf6RXRhOWH4W6XJlH298EEEOkx9EYTajttGSWZBujVR4xXa58gpduv05nN8kHMYF21tcjVTEJS6_LyMIzfeCoSsb7MzkiyeybUYkWb2cdkZxOSx2oi6jva1GZzvkNA_gM_otxeEKaWbAf7x3YgYt_HIdcvEXS0OTsVCzvQ">
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">FaceVault</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enterprise Authentication</p>
</div>
<!-- Login Card -->
<div class="bg-surface rounded-xl border border-border-subtle shadow-elevation-1 p-stack-lg flex flex-col gap-stack-lg">
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Admin ID Field -->
<div class="flex flex-col gap-baseline">
<label class="font-label-md text-label-md text-on-surface" for="admin-id">Admin ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: &quot;FILL&quot; 0;">badge</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface border border-border-subtle rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" id="admin-id" name="admin-id" placeholder="Enter your Admin ID" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-baseline">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: &quot;FILL&quot; 0;">lock</span>
<input class="w-full h-12 pl-10 pr-10 bg-surface border border-border-subtle rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" id="password" name="password" placeholder="Enter your password" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-baseline">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="w-4 h-4 border-border-subtle rounded text-primary-container focus:ring-primary-container focus:ring-offset-0 bg-surface cursor-pointer peer appearance-none checked:bg-primary-container checked:border-primary-container transition-all" type="checkbox">
<span class="material-symbols-outlined absolute text-on-primary text-[14px] pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: &quot;wght&quot; 600;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-secondary hover:text-primary-container transition-colors focus:outline-none focus:underline underline-offset-4" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="mt-stack-sm w-full h-12 bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container active:scale-[0.98]" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: &quot;FILL&quot; 0;">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Note -->
<div class="flex items-center justify-center gap-2 text-on-surface-variant opacity-80">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: &quot;FILL&quot; 0;">wifi_off</span>
<span class="font-label-sm text-label-sm">Offline Login Supported</span>
</div>
</main>
