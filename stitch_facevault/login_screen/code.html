<body class="bg-background min-h-screen flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop text-on-background">

<main class="w-full max-w-[420px] bg-surface rounded-xl shadow-sm border border-border-subtle overflow-hidden flex flex-col">
<!-- Illustration Area -->
<div class="w-full h-48 bg-surface-container-low relative">
<img class="w-full h-full object-cover" data-alt="A clean, modern, flat-vector style enterprise illustration representing secure workforce management and AI technology. The color palette features deep corporate blues, crisp whites, and subtle silver accents. The composition is balanced and professional, depicting a secure biometric login concept or an abstract data node network. High-key lighting, minimalist aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCm7KFk4Wdr1gdG5VUiyzg_pnQhTb41vLiF-bfExT6CugieLbAaYItNMhjYNjMfqlw9mFhRghJzKR4lMk7VKQapeGLC47Y2B-sg-NALbChMe353KDsYSFHcGmUUs42dCEfaSfl083B01UX_V2xRFVGx0k9wTyjauREEbqcFMYhf4wwhZ-VgrPzfeYGU3br-k9Eoo7Aw5RYj68Nhb4J02Lzgf0jD7o_4xwiBb9lBPVjBJXYhBGCtUum3">
</div>
<!-- Form Content -->
<div class="p-container-padding-mobile md:p-container-padding-desktop flex flex-col gap-stack-lg">
<!-- Header -->
<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary"><h1 class="font-display-lg text-display-lg text-primary-container tracking-tight cursor-text" spellcheck="false" data-stitch-added-classes="cursor-text" style="--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; font-size: 32px; font-weight: 700; line-height: 40px; letter-spacing: -0.025em; --tw-text-opacity: 1; color: rgb(15, 76, 129); outline: none !important; box-shadow: none !important;">FaceVault</h1></h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-stack-sm">Secure Employee Authentication</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Employee ID -->
<div class="flex flex-col gap-baseline">
<label class="font-label-md text-label-md text-on-surface" for="employee-id">Employee ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">badge</span>
<input class="w-full h-12 pl-10 pr-3 border border-border-subtle rounded-DEFAULT font-body-md text-body-md text-on-surface bg-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 outline-none transition-all placeholder:text-outline-variant" id="employee-id" placeholder="e.g. EMP-12345" type="text">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-baseline">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-12 pl-10 pr-3 border border-border-subtle rounded-DEFAULT font-body-md text-body-md text-on-surface bg-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 outline-none transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Utilities Row -->
<div class="flex items-center justify-between mt-stack-sm">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-4 h-4 rounded border-border-subtle text-primary-container focus:ring-primary-container bg-surface cursor-pointer" type="checkbox">
<span class="font-body-md text-body-md text-on-surface-variant">Remember Device</span>
</label>
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-sm mt-stack-sm">
<button class="w-full h-12 bg-primary-container text-white rounded-DEFAULT font-label-md text-label-md flex items-center justify-center hover:bg-primary transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-primary-container" type="submit">
                        Login
                    </button>
<button class="w-full h-12 bg-surface border border-secondary text-secondary rounded-DEFAULT font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-secondary" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">fingerprint</span>
                        Biometric Login
                    </button>
</div>
</form>
<!-- Footer Offline Status -->
<div class="mt-stack-sm pt-stack-md border-t border-border-subtle flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-success" style="font-size: 18px;">cloud_done</span>
<span class="font-label-sm text-label-sm">Offline Login Supported</span>
</div>
</div>
</main>
